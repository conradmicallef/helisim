[package]
name = "helisim"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/conradmicallef/helisim"
description = "RC helicopter flight model, flybarless gyro, sensors, estimator and autopilot. Native for tests, wasm32 for the page."

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "helisim"
path = "src/bin/helisim.rs"

[dependencies]

[profile.release]
opt-level = 3

# Small page build: cargo build --profile wasm --target wasm32-unknown-unknown
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
